<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>SecureWatch Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins',sans-serif;

            background:#020617;

            min-height:100vh;

            display:flex;

            justify-content:center;

            align-items:center;

            overflow:hidden;
        }

        body::before{

            content:'';

            position:fixed;

            width:100%;

            height:100%;

            background:
            radial-gradient(circle at top left,#0ea5e9,transparent 30%),
            radial-gradient(circle at bottom right,#22c55e,transparent 30%);

            opacity:0.2;

            z-index:-1;
        }

        .login-box{

            width:380px;

            background:rgba(15,23,42,0.9);

            border:1px solid rgba(255,255,255,0.08);

            backdrop-filter:blur(12px);

            border-radius:20px;

            padding:40px;

            box-shadow:0 10px 40px rgba(0,0,0,0.5);
        }

        h1{

            text-align:center;

            color:#38bdf8;

            font-size:42px;

            margin-bottom:10px;
        }

        .subtitle{

            text-align:center;

            color:#cbd5e1;

            margin-bottom:35px;

            font-size:14px;
        }

        input{

            width:100%;

            padding:15px;

            margin-bottom:20px;

            border:none;

            outline:none;

            border-radius:12px;

            background:#1e293b;

            color:white;

            font-size:15px;
        }

        input::placeholder{

            color:#94a3b8;
        }

        button{

            width:100%;

            padding:15px;

            border:none;

            border-radius:12px;

            background:linear-gradient(
                135deg,
                #0ea5e9,
                #2563eb
            );

            color:white;

            font-size:16px;

            font-weight:600;

            cursor:pointer;

            transition:0.3s;
        }

        button:hover{

            transform:translateY(-2px);

            box-shadow:0 10px 20px rgba(37,99,235,0.4);
        }

        .error{

            margin-top:20px;

            text-align:center;

            color:#ef4444;

            font-size:14px;
        }

        .footer{

            text-align:center;

            margin-top:25px;

            color:#94a3b8;

            font-size:12px;
        }

        .footer span{

            color:#38bdf8;

            font-weight:600;
        }

    </style>

</head>

<body>

<div class="login-box">

    <h1>SecureWatch</h1>

    <p class="subtitle">
        Cybersecurity Monitoring Login
    </p>

    <form method="POST">

        <input type="text"
               name="username"
               placeholder="Enter Username"
               required>

        <input type="password"
               name="password"
               placeholder="Enter Password"
               required>

        <button type="submit">

            Login To Dashboard

        </button>

    </form>

    {% if error %}

    <div class="error">

        {{ error }}

    </div>

    {% endif %}

    <div class="footer">

        SecureWatch SOC Dashboard |
        Developed By <span>AMAL KRISHNA P</span>

    </div>

</div>

</body>
</html>
